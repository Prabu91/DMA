; Batas unggah PHP untuk aplikasi ini (dibaca php-fpm per direktori).
;
; Bawaan image php-fpm cuma 2M/8M/128M — terlalu kecil untuk lampiran kartu
; kanban (aplikasi mengizinkan 10 MB) dan untuk memperkecil foto ponsel yang
; butuh ratusan MB saat dibongkar GD. Ditaruh di repo supaya ikut terbawa tiap
; deploy, bukan setelan manual di server yang hilang saat container dibangun ulang.
upload_max_filesize = 12M
post_max_size = 16M
memory_limit = 256M
max_execution_time = 120
