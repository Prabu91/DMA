<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline — DMA</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
               font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #f3f4f6; color: #374151; }
        .card { text-align: center; padding: 2rem; max-width: 22rem; }
        h1 { font-size: 1.25rem; margin: 1rem 0 .5rem; color: #111827; }
        p { font-size: .9rem; line-height: 1.5; color: #6b7280; }
        .dot { width: 64px; height: 64px; border-radius: 16px; background: #4f46e5; margin: 0 auto;
               display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; }
        button { margin-top: 1.25rem; background: #4f46e5; color: #fff; border: 0; padding: .6rem 1.2rem;
                 border-radius: .5rem; font-size: .9rem; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <div class="dot">DMA</div>
        <h1>Anda sedang offline</h1>
        <p>Koneksi internet tidak tersedia. Periksa jaringan Anda lalu coba lagi.</p>
        <button onclick="location.reload()">Coba lagi</button>
    </div>
</body>
</html>
